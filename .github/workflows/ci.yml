name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: QFlareBot/QFlareBot
          path: QFlareBot

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: QFlareBot/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: 构建 SDK 与 plugin-cli
        working-directory: QFlareBot
        run: |
          pnpm install --frozen-lockfile --filter '@qqbot/plugin-cli...'
          pnpm --filter '@qqbot/plugin-cli...' build

      - name: 校验 tag 与 version 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - run: npm run typecheck

      - name: 检查页面生成物是否最新
        run: |
          npm run build:page
          git diff --exit-code -- src/page.generated.ts

      - name: 构建并校验声明清单
        run: |
          npm run build
          node -e "
            const fs = require('node:fs');
            const built = JSON.parse(fs.readFileSync('dist/manifest.json', 'utf8'));
            const declared = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const stable = (v) => {
              if (v === null || typeof v !== 'object') return JSON.stringify(v);
              if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
              return '{' + Object.keys(v).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
            };
            if (stable(built) !== stable(declared)) {
              console.error('manifest.json 与 dist/manifest.json 不一致；请运行 npm run sync 后提交');
              process.exit(1);
            }
          "

      - run: npm test
